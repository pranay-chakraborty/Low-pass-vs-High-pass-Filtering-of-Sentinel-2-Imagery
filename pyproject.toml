[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rsfilter"
version = "1.0.0"
description = "Low-pass and high-pass filtering of Sentinel-2 imagery (spatial and frequency domain)"
requires-python = ">=3.11"

[project.scripts]
rsfilter = "rsfilter.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
